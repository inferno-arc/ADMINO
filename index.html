<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSBGMI Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#070a10;
  color:#fff;
  min-height:100vh;
  padding:18px;
}

.container{
  max-width:900px;
  margin:auto;
}

/* LOGIN */

.login{
  max-width:400px;
  margin:80px auto;
  background:#111722;
  border:1px solid #293548;
  border-radius:18px;
  padding:25px;
}

.logo{
  text-align:center;
  color:#00eaff;
  font-size:32px;
  font-weight:900;
  margin-bottom:8px;
}

.login h2{
  text-align:center;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #303b4d;
  background:#090e16;
  color:#fff;
  outline:none;
}

input:focus{
  border-color:#00eaff;
}

.login button,
.submit{
  width:100%;
  padding:14px;
  margin-top:18px;
  border:0;
  border-radius:10px;
  background:#00d9ef;
  color:#061016;
  font-weight:bold;
  font-size:16px;
}

.error{
  color:#ff8585;
  text-align:center;
  margin-top:12px;
}

/* DASHBOARD */

.dashboard{
  display:none;
}

.header{
  text-align:center;
  padding:15px 0 25px;
}

.header p{
  color:#9ca3af;
  margin-top:5px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.logout{
  background:#252d3a;
  color:white;
  border:1px solid #3b4658;
  border-radius:9px;
  padding:10px 14px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat{
  background:#111722;
  border:1px solid #293548;
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:27px;
  color:#00eaff;
}

.stat span{
  color:#9ca3af;
  font-size:13px;
}

/* REGISTRATION */

.registration{
  background:#111722;
  border:1px solid #293548;
  border-radius:16px;
  padding:17px;
  margin-bottom:15px;
}

.regHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.badge{
  background:#00d9ef;
  color:#061016;
  border-radius:20px;
  padding:6px 10px;
  font-size:12px;
  font-weight:bold;
}

.teamName{
  color:#00eaff;
  font-size:20px;
  font-weight:bold;
}

.detail{
  background:#0b1018;
  border:1px solid #253144;
  border-radius:10px;
  padding:12px;
  margin-top:10px;
}

.detail b{
  color:#00eaff;
}

.player{
  background:#0b1018;
  border:1px solid #253144;
  border-radius:10px;
  padding:13px;
  margin-top:10px;
}

.playerTitle{
  color:#00eaff;
  font-weight:bold;
  margin-bottom:9px;
}

.delete{
  width:100%;
  margin-top:15px;
  padding:12px;
  border:0;
  border-radius:9px;
  background:#a91f1f;
  color:white;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#9ca3af;
  padding:40px 10px;
}

.hidden{
  display:none;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginBox" class="login">

  <div class="logo">TSBGMI</div>

  <h2>ADMIN LOGIN</h2>

  <input
    id="email"
    type="email"
    placeholder="Admin email"
  >

  <input
    id="password"
    type="password"
    placeholder="Admin password"
  >

  <button onclick="login()">
    LOGIN
  </button>

  <div id="loginError" class="error"></div>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="dashboard">

  <div class="header">
    <div class="logo">TSBGMI ADMIN</div>
    <p>Registration Dashboard</p>
  </div>


  <div class="topbar">

    <h2>Registrations</h2>

    <button
      class="logout"
      onclick="logout()">
      Logout
    </button>

  </div>


  <div class="stats">

    <div class="stat">
      <strong id="total">0</strong>
      <span>Total</span>
    </div>

    <div class="stat">
      <strong id="teams">0</strong>
      <span>Teams</span>
    </div>

    <div class="stat">
      <strong id="solos">0</strong>
      <span>Solo</span>
    </div>

  </div>


  <input
    id="search"
    type="text"
    placeholder="🔎 Search team, player, UID or IGN..."
    oninput="render()"
  >


  <div id="list">
    <div class="empty">
      Loading...
    </div>
  </div>

</div>

</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  onValue,
  remove
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =========================
   YOUR FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyDGu444d8XJQ27cZzh3rIYH3RtaJk3W0SM",

  authDomain:
  "tabgmi.firebaseapp.com",

  databaseURL:
  "https://tabgmi-default-rtdb.firebaseio.com",

  projectId:
  "tabgmi",

  storageBucket:
  "tabgmi.firebasestorage.app",

  messagingSenderId:
  "152073037485",

  appId:
  "1:152073037485:web:2172a74775e097eacb0824",

  measurementId:
  "G-22MSXBXJZD"
};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getDatabase(app);

let registrations={};


/* LOGIN */

window.login=async function(){

  const email=
    document.getElementById("email").value.trim();

  const password=
    document.getElementById("password").value;

  const error=
    document.getElementById("loginError");

  error.textContent="";

  if(!email || !password){

    error.textContent=
      "Enter email and password.";

    return;
  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);

    errorElement(
      "Invalid email or password."
    );

  }

};


/* ERROR */

function errorElement(text){

  document.getElementById(
    "loginError"
  ).textContent=text;

}


/* AUTH */

onAuthStateChanged(auth,user=>{

  if(user){

    document.getElementById(
      "loginBox"
    ).style.display="none";

    document.getElementById(
      "dashboard"
    ).style.display="block";

    loadData();

  }else{

    document.getElementById(
      "loginBox"
    ).style.display="block";

    document.getElementById(
      "dashboard"
    ).style.display="none";

  }

});


/* LOAD DATABASE */

function loadData(){

  const registrationsRef=
    ref(db,"registrations");

  onValue(
    registrationsRef,
    snapshot=>{

      registrations=
        snapshot.val() || {};

      render();

    }
  );

}


/* RENDER */

window.render=function(){

  const list=
    document.getElementById("list");

  const search=
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

  const entries=
    Object.entries(registrations);

  let teamCount=0;
  let soloCount=0;

  entries.forEach(([id,data])=>{

    if(data.registrationType==="Team")
      teamCount++;

    if(data.registrationType==="Solo")
      soloCount++;

  });

  document.getElementById(
    "total"
  ).textContent=entries.length;

  document.getElementById(
    "teams"
  ).textContent=teamCount;

  document.getElementById(
    "solos"
  ).textContent=soloCount;


  const filtered=
    entries.filter(([id,data])=>{

      return JSON.stringify(data)
        .toLowerCase()
        .includes(search);

    });


  if(filtered.length===0){

    list.innerHTML=
      `<div class="empty">
        No registrations found.
       </div>`;

    return;
  }


  list.innerHTML="";


  filtered.reverse().forEach(
    ([id,data])=>{

      const card=
        document.createElement("div");

      card.className="registration";


      if(data.registrationType==="Team"){

        card.innerHTML=`

          <div class="regHeader">

            <div class="teamName">
              ${safe(data.teamName)}
            </div>

            <div class="badge">
              TEAM
            </div>

          </div>


          <div class="detail">
            <b>Captain:</b>
            ${safe(data.captainName)}
          </div>


          ${player(
            "PLAYER 1",
            data.player1
          )}

          ${player(
            "PLAYER 2",
            data.player2
          )}

          ${player(
            "PLAYER 3",
            data.player3
          )}

          ${player(
            "PLAYER 4",
            data.player4
          )}


          <div class="detail">
            <b>WhatsApp:</b>
            ${safe(data.phone)}
          </div>


          <div class="detail">
            <b>Registered:</b>
            ${date(data.registeredAt)}
          </div>


          <button
            class="delete"
            onclick="deleteReg('${id}')">
            🗑 DELETE
          </button>

        `;

      }else{

        card.innerHTML=`

          <div class="regHeader">

            <div class="teamName">
              Solo Player
            </div>

            <div class="badge">
              SOLO
            </div>

          </div>


          ${player(
            "SOLO PLAYER",
            data.player
          )}


          <div class="detail">
            <b>WhatsApp:</b>
            ${safe(data.phone)}
          </div>


          <div class="detail">
            <b>Registered:</b>
            ${date(data.registeredAt)}
          </div>


          <button
            class="delete"
            onclick="deleteReg('${id}')">
            🗑 DELETE
          </button>

        `;

      }


      list.appendChild(card);

    }
  );

};


/* PLAYER */

function player(title,p){

  if(!p) return "";

  return`

    <div class="player">

      <div class="playerTitle">
        ${title}
      </div>

      <div>
        <b>Name:</b>
        ${safe(p.name)}
      </div>

      <div style="margin-top:7px">
        <b>BGMI UID:</b>
        ${safe(p.uid)}
      </div>

      <div style="margin-top:7px">
        <b>IGN:</b>
        ${safe(p.ign)}
      </div>

    </div>

  `;

}


/* DELETE */

window.deleteReg=async function(id){

  if(!confirm(
    "Delete this registration?"
  )) return;

  try{

    await remove(
      ref(
        db,
        "registrations/"+id
      )
    );

  }catch(error){

    alert("Delete failed.");

  }

};


/* LOGOUT */

window.logout=async function(){

  await signOut(auth);

};


/* DATE */

function date(value){

  if(!value) return "-";

  return new Date(value)
    .toLocaleString();

}


/* SAFE HTML */

function safe(value){

  if(value===undefined ||
     value===null)
    return "-";

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
